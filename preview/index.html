<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef3f6"><title>まもり MAMORI · Japan disaster companion</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="data:,"></head>
<body>
<aside class="sidebar"><a href="#" class="brand" aria-label="MAMORI home"><span class="brand-icon">守</span><span>まもり<small>MAMORI FOR ROKID</small></span></a><div class="side-label" data-ja="あなたの防災コンパニオン" data-zh="你的日本防灾助手"></div><nav aria-label="Main"><button class="nav-button active" data-view="overview"><span>◉</span><span data-ja="いまの状況" data-zh="当前情况"></span></button><button class="nav-button" data-view="guides"><span>◇</span><span data-ja="身を守るガイド" data-zh="自救行动指南"></span></button><button class="nav-button" data-view="sources"><span>▤</span><span data-ja="情報源とできること" data-zh="数据来源与能力"></span></button></nav><div class="sidebar-bottom"><span class="outline-label">JAPAN</span><p data-ja="もしもの時に、\n次の一歩を。" data-zh="关键时刻，\n知道下一步。"></p><small>AIUI 0.17.0 · PROTOTYPE</small></div></aside>
<div class="workspace"><header class="topbar"><span class="breadcrumb" data-ja="防災アシスタント / いまの状況" data-zh="防灾智能体 / 当前情况"></span><div class="header-controls"><a href="/aiui-runtime.html?lang=zh" data-ja="原生Inkデモ ↗" data-zh="原生 Ink 演示 ↗"></a><span id="network" class="network"></span><button id="language" aria-label="Switch language">日本語 / 中文</button><time id="clock"></time></div></header><main>
<div class="page-heading"><div><div class="eyebrow">STAY AWARE. ACT EARLY.</div><h1 data-ja="今日を、安心につなぐ。" data-zh="读懂风险，及时行动。"></h1><p data-ja="日本の公式情報と、いま取るべき行動をひとつに。" data-zh="连接日本官方信息与此刻需要采取的行动。"></p></div><span class="prototype" data-ja="開発プレビュー" data-zh="开发预览"></span></div>
<div class="context-bar"><label for="office" data-ja="確認する場所" data-zh="查询地点"></label><select id="office" aria-label="Prefecture"><option value="">— 都道府県 / 地区 —</option></select><select id="city" aria-label="Municipality" disabled><option value="">— 市区町村 —</option></select><button id="refresh" class="button small-button" data-ja="情報を更新 ↻" data-zh="刷新信息 ↻"></button><span id="checked" class="muted"></span></div>
<section id="overview-view" class="view"><article class="location-entry"><form id="location-form"><label for="address-query" data-ja="住所・市町村・郵便番号" data-zh="地址、市町村或邮编"></label><div class="location-inputs"><input id="address-query" maxlength="150" placeholder="東京都渋谷区 / 150-0001" autocomplete="off"><button class="button" type="submit" data-ja="候補を探す" data-zh="搜索候选"></button><button class="button secondary" type="button" id="voice-address" data-ja="音声" data-zh="语音"></button><button class="button secondary" type="button" id="gps" data-ja="GPS" data-zh="GPS"></button></div></form><p class="micro" data-ja="GPSは国土地理院に座標を送信し、候補を表示します。座標は保存しません。" data-zh="GPS 将坐标发送至国土地理院换算地址，仅展示候选；不保存坐标。"></p><div id="location-message" role="status"></div><div id="address-candidates"></div><label for="coast" data-ja="津波予報の沿岸（海辺にいる場合は確認）" data-zh="海啸预报沿岸（在海边时请确认）"></label><select id="coast" aria-label="Tsunami coast"></select></article><div class="main-grid"><div class="left-column">
<article class="status-card"><div class="section-top"><span class="eyebrow" data-ja="選択した場所の気象情報" data-zh="所选地点气象信息"></span><span id="data-badge" class="badge"></span></div><div class="status-main"><div class="status-symbol" aria-hidden="true">?</div><div><h2 id="status-title"></h2><p id="status-copy"></p></div></div><div id="warning-list"></div><div class="status-foot"><span data-ja="気象庁の情報 ≠ 自治体の避難指示" data-zh="气象厅信息 ≠ 地方政府避难指示"></span><a href="https://www.jma.go.jp/bosai/" target="_blank" rel="noopener" data-ja="公式情報を確認 ↗" data-zh="查看官方信息 ↗"></a></div></article>
<article class="weather-card"><div class="section-top"><h2 data-ja="天気の見通し" data-zh="天气预报"></h2><span class="muted">JMA / XML</span></div><div id="forecast" class="forecast"></div><p id="forecast-source" class="micro"></p></article>
<article class="guide-strip"><div class="section-top"><h2 data-ja="いま、身を守る" data-zh="立即保护自己"></h2><span class="offline-tag" data-ja="オフライン対応" data-zh="可离线使用"></span></div><div class="hazard-grid" id="quick-hazards"></div></article></div>
<div class="right-column"><article class="assistant-card"><div class="section-top"><span class="assistant-mark">守</span><span><strong data-ja="まもりに相談" data-zh="向まもり提问"></strong><small data-ja="状況から、行動を見つける" data-zh="根据情境，找到行动步骤"></small></span><span class="dot"></span></div><div id="chat" class="chat" aria-live="polite"><p class="assistant-message" id="greeting"></p></div><div class="suggestions"><button data-prompt="海の近くで強い揺れを感じた" data-ja="海の近くで揺れを感じた" data-zh="海边感到强烈摇晃"></button><button data-prompt="道路が冠水して通れない" data-ja="道が冠水して通れない" data-zh="道路积水，无法通过"></button></div><form id="chat-form"><input id="question" maxlength="500" aria-label="Message" placeholder="状況を入力 / 描述你的情况" autocomplete="off"><button type="submit" aria-label="Send message">↑</button></form><div class="micro chat-note" data-ja="緊急時は画面より身の安全を優先。" data-zh="紧急时优先保护自己，避免分心阅读。"></div></article>
<article class="glasses-card"><div class="section-top"><span data-ja="眼鏡で見える、行動の全体" data-zh="眼镜中的一屏行动指南"></span><span class="mono">480 × 352</span></div><div class="hud"><div class="hud-top"><span>MAMORI / 防災</span><span id="hud-count">1 / 3</span></div><p id="hud-title"></p><p id="hud-detail"></p><div class="hud-foot"><span data-ja="必要な行動を、一画面に。" data-zh="关键行动，一屏看全。"></span><span>→</span></div></div><p class="micro" data-ja="単色の表示イメージ。実機接続なし。" data-zh="单色显示示意，尚未连接实机。"></p></article></div></div>
<article class="national-card"><div class="section-top"><h2 data-ja="全国の地震・火山・津波情報" data-zh="日本全国地震、火山、海啸通报"></h2><span class="muted" data-ja="発表履歴 / 現地の警報状態ではありません" data-zh="发布记录 / 不代表当地当前预警"></span></div><div id="national" class="national-list"></div></article></section>
<section id="guides-view" class="view" hidden><article class="guide-library"><div class="section-top"><h2 data-ja="状況に合わせて選ぶ" data-zh="按实际情况选择"></h2><span class="offline-tag" data-ja="ネット接続なしでも読めます" data-zh="断网仍可查看"></span></div><div id="all-hazards" class="library-grid"></div></article></section>
<section id="sources-view" class="view" hidden><article class="source-card"><h2 data-ja="情報を、正しく使うために。" data-zh="了解信息的来源和边界。"></h2><div id="sources-content"></div></article></section>
<footer><span>まもり / MAMORI</span><p data-ja="公的な緊急速報の代わりにはなりません。自治体・気象庁の最新情報を併用してください。" data-zh="不能替代官方紧急预警，请同时关注地方政府与气象厅最新信息。"></p><a href="https://www.fdma.go.jp/mission/enrichment/kyukyumusen_kinkyutuhou/119.html" target="_blank" rel="noopener" data-ja="救急・救助 119 ↗" data-zh="急救与救援 119 ↗"></a></footer>
</main></div>
<dialog id="guide-dialog" aria-labelledby="guide-title"><div class="dialog-top"><span class="eyebrow" id="guide-category"></span><button id="close-guide" aria-label="Close guide">×</button></div><h2 id="guide-title"></h2><ul id="guide-points" class="guide-points"></ul><div id="blocked-choice"><button id="blocked-button" data-ja="外の移動が危険" data-zh="无法安全外出"></button></div><p id="guide-message" role="status"></p><div class="guide-actions"><button id="speak" class="button secondary" data-ja="読み上げ" data-zh="朗读"></button><button id="guide-shelters" class="button" data-ja="近くの避難先" data-zh="附近避难地点"></button></div><a id="guide-source" target="_blank" rel="noopener" data-ja="公式資料 ↗" data-zh="官方依据 ↗"></a></dialog>
<dialog id="alert-dialog" aria-labelledby="alert-title"><div class="dialog-top"><span id="alert-state"></span><button id="close-alert" aria-label="Close alert">×</button></div><h2 id="alert-title"></h2><p id="alert-area"></p><dl id="alert-metrics"></dl><p id="alert-countdown" role="timer"></p><p id="alert-time" class="micro"></p><p id="alert-message"></p><div class="guide-actions"><button id="alert-guide" class="button" data-ja="今すぐ行動を確認" data-zh="立即查看应对"></button><button id="alert-shelters" class="button secondary" data-ja="避難先を探す" data-zh="查询避难地"></button></div><a id="alert-source" target="_blank" rel="noopener" data-ja="公式電文 ↗" data-zh="官方电文 ↗"></a></dialog>
<dialog id="shelter-dialog" aria-labelledby="shelter-title"><div class="dialog-top"><h2 id="shelter-title" data-ja="指定緊急避難場所" data-zh="指定紧急避难场所"></h2><button id="close-shelters" aria-label="Close shelters">×</button></div><label for="shelter-hazard" data-ja="対応する災害を選択" data-zh="选择实际灾种"></label><select id="shelter-hazard"></select><button id="find-shelters" class="button" data-ja="GPSで近くを検索" data-zh="GPS 查询附近"></button><p class="micro" data-ja="現在地をサーバーに送り、国土地理院の場所を照会。座標は保存しません。" data-zh="当前位置发送至后端以查询国土地理院地点，不保存坐标。"></p><p id="shelter-message" role="status"></p><div id="shelter-results"></div></dialog>
